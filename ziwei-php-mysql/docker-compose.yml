services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-1}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Taipei}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-ziwei}
      DB_USER: ${DB_USER:-ziwei}
      DB_PASS: ${DB_PASS:-ziwei_change_me}
    volumes:
      - ./public:/var/www/html
      - ./src:/var/www/src:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-ziwei}
      MYSQL_USER: ${DB_USER:-ziwei}
      MYSQL_PASSWORD: ${DB_PASS:-ziwei_change_me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_change_me}
      TZ: ${APP_TIMEZONE:-Asia/Taipei}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - ziwei_mysql:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

volumes:
  ziwei_mysql:
